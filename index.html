<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>工業辨識系統 - 旗艦正式版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100vh; /* 預設 PC 全螢幕 */
      overflow: hidden; /* 預設 PC 禁用拉霸 */
      font-family: 'Noto Sans TC', sans-serif;
      background: #eaedf2;
    }

    /* RWD 直式排列切換：開啟拉霸與高度自適應 */
    @media (max-width: 900px) {
      html, body {
        height: auto;
        overflow-y: auto;
      }
    }

    .brand-bg {
      background: #e2231a;
    }

    .brand-text {
      color: #e2231a;
    }

    #layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    @media (max-width: 900px) {
      #layout { height: auto; }
    }

    #header {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    #main {
      flex: 1;
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 16px;
      padding: 16px 24px;
      min-height: 0; /* 重要：防止子元素撐開 Grid 導致拉霸 */
      width: 100vw;
    }

    /* 直式作業優化 */
    @media (max-width: 900px) {
      #main {
        display: flex;
        flex-direction: column;
        padding: 12px;
        flex: none;
      }
      #cam-card { order: 1; }
      #info-col { order: 2; }
      #model-info-card { order: 3; }
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    /* 左側佈局 */
    #cam-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-height: 0;
    }

    #video-container {
      flex: 1;
      background: #000;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #scanner-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border: 1px solid rgba(226, 35, 26, 0.4);
      background: rgba(226, 35, 26, 0.05);
      z-index: 10;
      pointer-events: none;
    }

    .scan-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #e2231a;
      border-style: solid;
      border-width: 0;
    }

    .tl {
      top: -1px;
      left: -1px;
      border-width: 4px 0 0 4px;
    }

    .tr {
      top: -1px;
      right: -1px;
      border-width: 4px 4px 0 0;
    }

    .bl {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 4px 4px;
    }

    .br {
      bottom: -1px;
      right: -1px;
      border-width: 0 4px 4px 0;
    }

    /* 右側佈局 (實現完美比例) */
    #analysis-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* 中央預覽區：優化 PC 上的拉霸問題，強迫在固定空間內縮放 */
    #preview-flex {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      min-height: 0; /* 允許縮小以防止頂開版面 */
    }

    #preview-area {
      height: 100%; /* 回歸受控高度 */
      aspect-ratio: 1/1;
      background: #f3f4f6;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e5e7eb;
    }

    #preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #ai-box { background: #fff1f0; border: 1px solid #ffa39e; border-radius: 8px; padding: 10px 14px; margin-bottom: 6px; overflow: hidden; }
    .manual-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
    
    #model-info-card { flex-shrink: 0; }

    .btn {
      height: 50px;
      border-radius: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-red {
      background: #e2231a;
      color: #fff;
    }

    .btn-gray {
      background: #f1f5f9;
      color: #4b5563;
      border: 1px solid #e2e8f0;
    }

    .btn-disabled {
      background: #f3f4f6;
      color: #cbd5e1;
      cursor: not-allowed;
    }

    .input-field {
      width: 100%;
      background: transparent;
      border: none;
      font-size: 26px;
      font-family: monospace;
      font-weight: bold;
      outline: none;
    }

    .lbl {
      font-size: 11px;
      font-weight: bold;
      color: #e2231a;
      margin-bottom: 2px;
      text-transform: uppercase;
    }

    .lbl-gray {
      color: #6b7280;
    }

    #login-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #e2231a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div id="login-overlay">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-80 text-center">
      <div class="text-2xl font-bold mb-6 brand-text">工業辨識登入</div>
      <input type="password" id="access-code" placeholder="請輸入存取碼"
        class="w-full bg-slate-50 p-4 rounded-xl text-center mb-6 outline-none font-bold border border-gray-100">
      <button onclick="checkAccess()" class="w-full brand-bg text-white py-4 rounded-xl font-bold text-lg">進入系統</button>
    </div>
  </div>

  <div id="layout">
    <header id="header" class="brand-bg">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 bg-white rounded flex items-center justify-center font-bold brand-text text-sm">W</div>
        <div class="font-bold text-sm tracking-tight">工業產品辨識終端</div>
      </div>
      <div class="flex items-center gap-4 text-xs font-bold uppercase">
        <span id="clock" class="bg-black/10 px-2.5 py-1 rounded">00:00:00</span>
        <span class="flex items-center gap-1.5"><span
            class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span>System Online</span>
      </div>
    </header>

    <div id="main">
      <div id="cam-col">
        <div id="cam-card" class="card flex-1">
          <div class="flex justify-between items-center mb-2">
            <div class="text-xs font-bold flex items-center gap-2"><span
                class="w-1.5 h-4 brand-bg rounded-full"></span>鏡頭視角</div>
            <select id="cam-sel"
              class="text-[10px] bg-gray-50 px-2 py-1 rounded font-bold border-none outline-none"></select>
          </div>
          <div id="video-container">
            <video id="video" autoplay playsinline muted></video>
            <div id="scanner-box">
              <div class="scan-corner tl"></div>
              <div class="scan-corner tr"></div>
              <div class="scan-corner bl"></div>
              <div class="scan-corner br"></div>
            </div>
          </div>
          <button id="capture-btn" onclick="capture()" class="btn btn-red mt-3 text-lg shadow-sm">啟動影像辨識</button>
        </div>
        <div id="model-info-card" class="card !h-14 !min-h-0 !flex-row items-center gap-10 px-8">
          <div class="flex-1"><span class="lbl-gray text-[9px] font-bold">曝光：</span><span
              class="text-xs font-bold font-mono">AUTO</span></div>
          <div class="flex-1"><span class="lbl-gray text-[9px] font-bold">閾值：</span><span
              class="text-xs font-bold font-mono">0.5</span></div>
          <div class="flex-1 text-right text-xs font-bold text-green-600 tracking-wider">PRO MODE</div>
        </div>
      </div>

      <div id="info-col">
        <div id="analysis-card" class="card">
          <div class="text-xs font-bold flex items-center gap-2 mb-3 brand-text"><span
              class="w-1.5 h-4 brand-bg rounded-sm"></span>辨識結果</div>

          <div id="preview-flex">
            <div id="preview-area">
              <!-- 將預設佔位符改為 1000x1000 (原本是24x24)，防止瀏覽器渲染引擎錯誤塌陷 -->
              <img id="preview-img"
                src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000' fill='%23eee'%3E%3Crect width='1000' height='1000'/%3E%3C/svg%3E">
            </div>
          </div>

          <div id="ai-box">
            <span class="lbl">AI 辨識編號</span>
            <!-- 加入 truncate (單行省略號) 避免 AI 回傳超長錯誤訊息把版面撐爆 -->
            <div id="ai-res-val" class="font-bold text-3xl text-red-600 font-mono tracking-tighter truncate w-full" title="辨識結果">--</div>
          </div>

          <div class="manual-box">
            <span class="lbl-gray text-[9px] font-bold">人工核對數據</span>
            <input type="text" id="manual-input" class="input-field" placeholder="...">
          </div>

          <div id="status-msg" class="hidden text-center text-[10px] p-2 rounded mb-2 font-bold"></div>

          <div class="grid grid-cols-4 gap-2">
            <button onclick="copyToClipboard()" class="btn btn-gray col-span-1">複製</button>
            <button id="save-btn" onclick="saveRecord()" class="btn btn-disabled col-span-3">儲存紀錄</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <canvas id="crop-cvs" style="display:none;"></canvas>

  <script>
    // 請確認手動更換下方的 URL
    const API_URL = 'https://script.google.com/macros/s/AKfycbxw9A0k4KZAOakCcx2CnNtcOfXnioR06jGhgIKpcB5-n4yMFKe_X4AT2mSLGLU_28N0/exec';
    let ACCESS_CODE = localStorage.getItem('demo_access_code') || '';
    let currentStream = null, lastB64 = null;

    function checkAccess() {
      const code = document.getElementById('access-code').value;
      if (!code) return;
      ACCESS_CODE = code;
      localStorage.setItem('demo_access_code', code);
      document.getElementById('login-overlay').style.display = 'none';
      initCams();
    }
    if (ACCESS_CODE) { document.getElementById('access-code').value = ACCESS_CODE; checkAccess(); }

    async function initCams() {
      try {
        const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
        tmp.getTracks().forEach(t => t.stop());
        const devices = await navigator.mediaDevices.enumerateDevices();
        const cams = devices.filter(d => d.kind === 'videoinput');
        const s = document.getElementById('cam-sel');
        s.innerHTML = cams.map((c, i) => `<option value="${c.deviceId}">${c.label || '相機 ' + i}</option>`).join('');
        if (cams.length) start(cams[0].deviceId);
      } catch (e) { alert('設備異常: ' + e.message); }
    }

    async function start(id) {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      currentStream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: id } } });
      document.getElementById('video').srcObject = currentStream;
    }

    document.getElementById('cam-sel').onchange = (e) => start(e.target.value);

    async function capture() {
      const v = document.getElementById('video');
      const box = document.getElementById('scanner-box');
      const vr = v.getBoundingClientRect(), sr = box.getBoundingClientRect();
      const sx = v.videoWidth / vr.width, sy = v.videoHeight / vr.height;
      const cvs = document.getElementById('crop-cvs'), ctx = cvs.getContext('2d');
      cvs.width = sr.width * sx; cvs.height = sr.height * sy;
      ctx.drawImage(v, (sr.left - vr.left) * sx, (sr.top - vr.top) * sy, cvs.width, cvs.height, 0, 0, cvs.width, cvs.height);
      const b64 = cvs.toDataURL('image/jpeg', 0.9);
      lastB64 = b64.split(',')[1];
      document.getElementById('preview-img').src = b64;
      document.getElementById('ai-res-val').innerText = '...';
      const res = await callBackend('recognize', { imageBase64: lastB64 });
      if (res.success) {
        document.getElementById('ai-res-val').innerText = res.result;
        document.getElementById('manual-input').value = res.result;
        document.getElementById('save-btn').className = 'btn btn-red col-span-3 shadow-md';
      }
    }

    async function saveRecord() {
      const b = document.getElementById('save-btn');
      if (b.classList.contains('btn-disabled')) return;
      const oldTxt = b.innerText;
      b.innerText = '處理中...'; b.className = 'btn btn-disabled col-span-3';
      const res = await callBackend('save', {
        imageBase64: lastB64, aiResult: document.getElementById('ai-res-val').innerText, manualResult: document.getElementById('manual-input').value
      });
      if (res.success) {
        showStatus('✓ 已成功儲存', 'green');
        b.innerText = oldTxt; b.className = 'btn btn-red col-span-3';
      }
    }

    async function callBackend(action, extra) {
      if (API_URL.includes('您的_GAS')) return { success: false, error: '網址未填' };
      try {
        const res = await fetch(API_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action, access_code: ACCESS_CODE, ...extra })
        });
        return await res.json();
      } catch (e) { return { success: false, error: '連線錯誤' }; }
    }

    function showStatus(m, c) {
      const e = document.getElementById('status-msg');
      e.innerText = m; e.className = `block text-center text-[10px] p-2 rounded mb-2 bg-${c}-50 text-${c}-600 font-bold`;
      setTimeout(() => e.className = 'hidden', 3000);
    }

    function copyToClipboard() {
      const input = document.getElementById('manual-input');
      if (!input.value) return;
      navigator.clipboard.writeText(input.value).then(() => {
        showStatus('✓ 已複製', 'green');
      });
    }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('zh-TW', { hour12: false }); }, 1000);
  </script>
</body>

</html>
